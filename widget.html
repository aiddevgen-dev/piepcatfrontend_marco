<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice AI Widget</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .widget-container {
      width: 100%;
      max-width: 480px;
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 32px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
      overflow: hidden;
      position: relative;
    }

    .gradient-bg {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(147, 51, 234, 0.05) 0%, rgba(255, 255, 255, 0.2) 100%);
      z-index: 0;
    }

    .header {
      position: relative;
      z-index: 10;
      padding: 32px 32px 0;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 9999px;
      background: rgba(147, 51, 234, 0.1);
      border: 1px solid rgba(147, 51, 234, 0.2);
      margin-bottom: 24px;
    }

    .badge svg {
      width: 14px;
      height: 14px;
      color: #9333ea;
    }

    .badge span {
      font-size: 12px;
      font-weight: 500;
      color: #581c87;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .title {
      font-size: 2.5rem;
      font-weight: 400;
      color: #0f172a;
      line-height: 1.2;
      margin-bottom: 16px;
      font-family: Georgia, 'Times New Roman', serif;
    }

    .subtitle {
      color: #475569;
      font-size: 1.1rem;
      line-height: 1.6;
      max-width: 400px;
    }

    .visualizer-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 280px;
      padding: 32px;
      position: relative;
      z-index: 10;
    }

    .pulsing-circle-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Ripple effects - only visible when active */
    .ripple {
      position: absolute;
      inset: 0;
      background: rgba(168, 85, 247, 0.2);
      border-radius: 50%;
      opacity: 0;
      transform: scale(1);
    }

    .ripple.active {
      animation: ripple-animation 2s ease-out infinite;
    }

    .ripple.active.delayed {
      animation-delay: 0.5s;
    }

    @keyframes ripple-animation {
      0% { opacity: 0; transform: scale(1); }
      50% { opacity: 0.4; }
      100% { opacity: 0; transform: scale(2); }
    }

    .ripple.delayed.active {
      animation: ripple-animation-small 2s ease-out infinite;
      animation-delay: 0.5s;
    }

    @keyframes ripple-animation-small {
      0% { opacity: 0; transform: scale(1); }
      50% { opacity: 0.4; }
      100% { opacity: 0; transform: scale(1.5); }
    }

    .core-circle {
      width: 128px;
      height: 128px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0f172a 0%, #334155 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 10;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      transition: box-shadow 0.3s ease, transform 0.3s ease;
    }

    .core-circle.active {
      animation: pulse-circle 1.5s ease-in-out infinite;
      box-shadow: 0 0 40px 10px rgba(168, 85, 247, 0.4);
    }

    @keyframes pulse-circle {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    .visualizer-bars {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      height: 48px;
    }

    .bar {
      width: 8px;
      height: 8px;
      background: white;
      border-radius: 9999px;
      opacity: 0.9;
      transition: height 0.3s ease;
    }

    .bar.active {
      animation: bar-animation 0.6s ease-in-out infinite alternate;
    }

    .bar:nth-child(1).active { animation-delay: 0.1s; }
    .bar:nth-child(2).active { animation-delay: 0.2s; }
    .bar:nth-child(3).active { animation-delay: 0.3s; }
    .bar:nth-child(4).active { animation-delay: 0.4s; }
    .bar:nth-child(5).active { animation-delay: 0.5s; }

    @keyframes bar-animation {
      0% { height: 10px; }
      100% { height: 32px; }
    }

    .status-badge {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      padding: 6px 16px;
      border-radius: 9999px;
      font-size: 14px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s ease;
    }

    .status-badge.disconnected {
      background: #f1f5f9;
      color: #64748b;
      border: 1px solid #e2e8f0;
    }

    .status-badge.connected {
      background: #dcfce7;
      color: #15803d;
      border: 1px solid #bbf7d0;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .status-dot.disconnected {
      background: #94a3b8;
    }

    .status-dot.connected {
      background: #22c55e;
      animation: pulse-dot 1s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .action-area {
      padding: 32px;
      position: relative;
      z-index: 10;
      background: rgba(255, 255, 255, 0.3);
      border-top: 1px solid rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(10px);
    }

    .transcript-area {
      text-align: center;
      margin-bottom: 32px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
    }

    .transcript-text {
      font-size: 1.25rem;
      font-weight: 500;
      color: #1e293b;
      transition: opacity 0.3s ease;
    }

    .call-button {
      width: 100%;
      padding: 16px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-size: 1.1rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    .call-button:hover {
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15);
      transform: translateY(-1px);
    }

    .call-button:active {
      transform: scale(0.98);
    }

    .call-button.start {
      background: #0f172a;
      color: white;
    }

    .call-button.start:hover {
      background: #1e293b;
    }

    .call-button.end {
      background: #f43f5e;
      color: white;
    }

    .call-button.end:hover {
      background: #e11d48;
    }

    .call-button svg {
      width: 20px;
      height: 20px;
    }

    .error-message {
      margin-top: 16px;
      padding: 12px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 12px;
      color: #dc2626;
      font-size: 14px;
      text-align: center;
    }

    /* Hidden audio element */
    #audioOutput {
      display: none;
    }
  </style>
</head>
<body>
  <audio id="audioOutput" autoplay></audio>

  <div class="widget-container">
    <div class="gradient-bg"></div>

    <!-- Header -->
    <div class="header">
      <div class="badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3l1.5 4.5L18 9l-4.5 1.5L12 15l-1.5-4.5L6 9l4.5-1.5L12 3z"/>
          <path d="M5 19l1 2 2-1-1-2-2 1z"/>
          <path d="M19 19l-1 2-2-1 1-2 2 1z"/>
        </svg>
        <span>Interactive Demo</span>
      </div>
      <h1 class="title">Talk to us.</h1>
      <p class="subtitle">Experience the future of voice AI. Click the button below to start a conversation.</p>
    </div>

    <!-- Visualizer Area -->
    <div class="visualizer-area">
      <div class="pulsing-circle-container">
        <!-- Ripple effects -->
        <div class="ripple" id="ripple1"></div>
        <div class="ripple delayed" id="ripple2"></div>

        <!-- Core circle -->
        <div class="core-circle" id="coreCircle">
          <div class="visualizer-bars">
            <div class="bar" id="bar1"></div>
            <div class="bar" id="bar2"></div>
            <div class="bar" id="bar3"></div>
            <div class="bar" id="bar4"></div>
            <div class="bar" id="bar5"></div>
          </div>
        </div>

        <!-- Status badge -->
        <div class="status-badge disconnected" id="statusBadge">
          <div class="status-dot disconnected" id="statusDot"></div>
          <span id="statusText">Ready to connect</span>
        </div>
      </div>
    </div>

    <!-- Action Area -->
    <div class="action-area">
      <div class="transcript-area">
        <p class="transcript-text" id="transcriptText">Hi, how can I help you today?</p>
      </div>

      <button class="call-button start" id="callButton" onclick="toggleCall()">
        <svg id="micIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" x2="12" y1="19" y2="22"/>
        </svg>
        <svg id="phoneIcon" style="display: none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
        </svg>
        <span id="buttonText">Start Conversation</span>
      </button>

      <div class="error-message" id="errorMessage" style="display: none;"></div>
    </div>
  </div>

  <!-- Bundled Pipecat dependencies -->
  <script src="widget-bundle.js"></script>

  <script>
    // ============================================
    // CONFIGURATION - EDIT THESE VALUES
    // ============================================
    const CONFIG = {
      // Your ngrok URL (backend server)
      BACKEND_URL: "https://widget.numbero.org",

      // Assistant ID to use
      ASSISTANT_ID: "assistant_groq_whisper"
    };
    // ============================================

    // Get Pipecat from window (loaded by widget-bundle.js)
    const { PipecatClient, RTVIEvent, WebSocketTransport } = window;

    // State
    let isConnected = false;
    let pipecatClient = null;
    const audioElement = document.getElementById('audioOutput');

    // DOM Elements
    const callButton = document.getElementById('callButton');
    const buttonText = document.getElementById('buttonText');
    const micIcon = document.getElementById('micIcon');
    const phoneIcon = document.getElementById('phoneIcon');
    const transcriptText = document.getElementById('transcriptText');
    const statusBadge = document.getElementById('statusBadge');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const coreCircle = document.getElementById('coreCircle');
    const ripple1 = document.getElementById('ripple1');
    const ripple2 = document.getElementById('ripple2');
    const bars = [
      document.getElementById('bar1'),
      document.getElementById('bar2'),
      document.getElementById('bar3'),
      document.getElementById('bar4'),
      document.getElementById('bar5')
    ];
    const errorMessage = document.getElementById('errorMessage');

    // Update UI based on connection state
    function updateUI(connected) {
      isConnected = connected;

      if (connected) {
        callButton.className = 'call-button end';
        buttonText.textContent = 'End Conversation';
        micIcon.style.display = 'none';
        phoneIcon.style.display = 'block';

        statusBadge.className = 'status-badge connected';
        statusDot.className = 'status-dot connected';
        statusText.textContent = 'Live Agent Active';

        coreCircle.classList.add('active');
        ripple1.classList.add('active');
        ripple2.classList.add('active');
        bars.forEach(bar => bar.classList.add('active'));
      } else {
        callButton.className = 'call-button start';
        buttonText.textContent = 'Start Conversation';
        micIcon.style.display = 'block';
        phoneIcon.style.display = 'none';

        statusBadge.className = 'status-badge disconnected';
        statusDot.className = 'status-dot disconnected';
        statusText.textContent = 'Ready to connect';

        coreCircle.classList.remove('active');
        ripple1.classList.remove('active');
        ripple2.classList.remove('active');
        bars.forEach(bar => bar.classList.remove('active'));
      }
    }

    function setTranscript(text) {
      transcriptText.textContent = text;
    }

    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.style.display = 'block';
      setTimeout(() => {
        errorMessage.style.display = 'none';
      }, 5000);
    }

    async function connect() {
      try {
        errorMessage.style.display = 'none';

        const config = {
          transport: new WebSocketTransport(),
          enableMic: true,
          enableCam: false,
          callbacks: {
            onConnected: () => {
              updateUI(true);
              setTranscript("Connected. Say hello!");
            },
            onDisconnected: () => {
              updateUI(false);
              setTranscript("Disconnected");
            },
            onBotReady: () => {
              setTranscript("Agent is ready.");
            },
            onUserTranscript: (data) => {
              if (data.final) {
                const msg = `You: ${data.text}`;
                setTranscript(msg);
                console.log(msg);
              }
            },
            onBotTranscript: (data) => {
              const msg = `Agent: ${data.text}`;
              setTranscript(msg);
              console.log(msg);
            },
            onError: (err) => {
              console.error("Pipecat error:", err);
              showError(err?.message || "Unknown error");
            }
          }
        };

        const client = new PipecatClient(config);
        pipecatClient = client;

        // Handle audio tracks
        client.on(RTVIEvent.TrackStarted, (track, participant) => {
          if (!participant?.local && track.kind === "audio" && audioElement) {
            const stream = new MediaStream([track]);
            audioElement.srcObject = stream;
          }
        });

        setTranscript("Initializing devices...");
        await client.initDevices();

        setTranscript("Connecting...");
        const response = await fetch(`${CONFIG.BACKEND_URL}/frontend/connect`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ assistant_id: CONFIG.ASSISTANT_ID })
        });

        if (!response.ok) {
          throw new Error(`Failed to get WebSocket URL: ${response.status}`);
        }

        const { ws_url } = await response.json();
        await client.connect({ wsUrl: ws_url });

      } catch (err) {
        console.error("Connection error:", err);
        showError(err.message || "Connection failed");
        updateUI(false);
        setTranscript("Connection failed");
      }
    }

    async function disconnect() {
      if (pipecatClient) {
        try {
          await pipecatClient.disconnect();
        } catch (err) {
          console.error("Disconnect error:", err);
        }
        pipecatClient = null;
        updateUI(false);
      }
    }

    async function toggleCall() {
      if (isConnected) {
        await disconnect();
      } else {
        await connect();
      }
    }

    // Clean up on page unload
    window.addEventListener('beforeunload', () => {
      if (pipecatClient) {
        pipecatClient.disconnect().catch(console.error);
      }
    });
  </script>
</body>
</html>
